<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2227">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Списание">
<title>Списание брака</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#ECEEEA; --paper:#FFFFFF; --ink:#1B2227; --muted:#525E66; --line:#D2D7D3;
  --marker:#F4C51F; --marker-ink:#1B2227; --ok:#17694F; --ok-bg:#DDEFE6; --danger:#B3261E; --warn-bg:#FFF3C4;
  --shadow:0 10px 30px rgba(27,34,39,.18);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#14181B; --paper:#1F2529; --ink:#ECEEEA; --muted:#A5AEB3; --line:#343C41;
    --ok:#56BC93; --ok-bg:#16322A; --danger:#F2786D; --warn-bg:#3A3316; --shadow:0 10px 30px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#14181B; --paper:#1F2529; --ink:#ECEEEA; --muted:#A5AEB3; --line:#343C41;
  --ok:#56BC93; --ok-bg:#16322A; --danger:#F2786D; --warn-bg:#3A3316; --shadow:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:Onest,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 140px}
h1{font-size:26px;line-height:1.15;font-weight:800;margin:0;letter-spacing:-.01em}
h2{font-size:18px;font-weight:700;margin:28px 0 10px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}

/* top bar */
.bar{display:flex;align-items:center;gap:8px;min-height:52px;margin:-4px -6px 12px}
.bar .grow{flex:1;min-width:0}
.bar .t{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .s{font-size:13px;color:var(--muted)}
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;flex:none}
.icon-btn:active{background:var(--line)}
.icon-btn svg{width:24px;height:24px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:12px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-weight:600;font-size:16px;text-align:center}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.btn.danger{color:var(--danger);border-color:transparent;background:transparent}
.btn:disabled{opacity:.4;cursor:default}
.btn:active:not(:disabled){transform:translateY(1px)}
.link{background:none;border:0;padding:10px 0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:500;min-height:44px}

/* login */
.login{padding-top:48px}
.mark{display:flex;gap:3px;height:36px;margin-bottom:22px}
.mark i{display:block;background:var(--ink)}
.field{display:block;margin-top:18px;font-weight:600;font-size:15px}
.field input,.field select{display:block;width:100%;margin-top:6px;min-height:52px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-size:17px;font-weight:500}
.err{color:var(--danger);font-size:14px;margin-top:10px;font-weight:500}

/* home */
.hello{margin:8px 0 4px}
.hint{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);border-radius:14px;padding:12px 8px 12px 14px;margin-top:18px;font-size:14px}
.hint b{display:block;font-size:15px;margin-bottom:2px}
.hint .icon-btn{width:36px;height:36px;margin-top:-4px}
.actions{display:grid;gap:10px;margin-top:20px}
.tile{display:flex;align-items:center;gap:14px;width:100%;padding:18px 16px;border-radius:16px;border:0;background:var(--paper);text-align:left;box-shadow:0 1px 0 var(--line)}
.tile .ic{width:48px;height:48px;border-radius:12px;background:var(--ground);display:grid;place-items:center;flex:none}
.tile .ic svg{width:26px;height:26px}
.tile b{display:block;font-size:17px}
.tile span{display:block;color:var(--muted);font-size:14px}
.tile.main .ic{background:var(--marker);color:var(--marker-ink)}
.list{display:grid;gap:8px}
.docrow{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:transparent;text-align:left}
.docrow .grow{flex:1;min-width:0}
.docrow b{display:block;font-size:16px}
.chip{display:inline-block;font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--line);white-space:nowrap}
.chip.sent{background:var(--ok-bg);color:var(--ok)}
.chip.draft{background:var(--warn-bg)}
.empty{padding:22px 16px;border:1.5px dashed var(--line);border-radius:14px;color:var(--muted);font-size:15px}

/* setup */
.opts{display:grid;gap:8px;margin-top:16px}
.opt{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;background:var(--paper);border:2px solid transparent;min-height:58px}
.opt input{width:22px;height:22px;accent-color:var(--ink);margin:0}
.opt b{min-width:52px}
.opt:has(input:checked){border-color:var(--ink)}

/* doc */
.banner{border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:12px}
.banner.ok{background:var(--ok-bg)}
.banner.warn{background:var(--warn-bg)}
.scan{position:relative;display:flex;align-items:center;gap:16px;width:100%;padding:22px 20px;border:0;border-radius:18px;background:var(--marker);color:var(--marker-ink);font-size:20px;font-weight:800;text-align:left;overflow:hidden;box-shadow:inset 0 -5px 0 rgba(0,0,0,.12)}
.scan::after{content:"";position:absolute;right:-18px;top:0;bottom:0;width:90px;background:repeating-linear-gradient(135deg,var(--marker-ink) 0 10px,transparent 10px 22px);opacity:.14}
.scan svg{width:34px;height:34px;flex:none}
.scan small{display:block;font-size:14px;font-weight:500;opacity:.8}
.items{display:grid;gap:8px;margin-top:6px}
.item{display:flex;gap:12px;align-items:center;width:100%;padding:12px 14px;border-radius:14px;border:0;background:var(--paper);text-align:left}
.item .grow{flex:1;min-width:0}
.item .nm{font-weight:600;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .mt{font-size:13px;color:var(--muted);margin-top:3px}
.qty{font-size:20px;font-weight:800;white-space:nowrap}
.qty small{font-size:13px;font-weight:600;color:var(--muted)}
.footer{position:fixed;left:0;right:0;bottom:0;background:var(--ground);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.footer .in{max-width:560px;margin:0 auto;display:grid;gap:8px}
.totals{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);gap:12px}
.totals b{color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,14,16,.5);z-index:20;animation:fade .15s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--paper);border-radius:20px 20px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;box-shadow:var(--shadow);animation:up .2s ease-out}
.sheet .in{max-width:560px;margin:0 auto}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{margin:8px 0 6px;font-size:20px;line-height:1.25}
.codes{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.codes b{color:var(--ink);font-weight:600}
.stepper{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;margin-top:6px}
.stepper button{min-height:60px;border-radius:12px;border:1.5px solid var(--line);background:var(--ground);font-size:28px;font-weight:600}
.stepper input{min-height:60px;text-align:center;font-size:26px;font-weight:800;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);width:100%}
.sheet .btns{display:grid;gap:8px;margin-top:20px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}

/* scanner */
.scanner{position:fixed;inset:0;z-index:30;background:#0C1012;color:#ECEEEA;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.scanner .top{display:flex;justify-content:space-between;align-items:center;padding:8px 10px}
.scanner .top .icon-btn{color:#ECEEEA}
.cam{flex:1;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,#2A3236 0,#0C1012 70%)}
.frame{position:relative;width:min(78vw,340px);aspect-ratio:1.6}
.frame i{position:absolute;width:34px;height:34px;border:4px solid var(--marker)}
.frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 8px}
.frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 8px 0}
.laser{position:absolute;left:8%;right:8%;top:50%;height:2px;background:#FF4D3D;box-shadow:0 0 12px #FF4D3D;animation:sweep 1.4s ease-in-out infinite alternate}
@keyframes sweep{from{transform:translateY(-38px)}to{transform:translateY(38px)}}
.scanner .caption{text-align:center;padding:18px 24px 6px;font-size:16px}
.scanner .proto{text-align:center;font-size:13px;color:#9AA4A9;padding:0 24px}
.scanner .bottom{padding:16px}
.scanner .btn{background:transparent;color:#ECEEEA;border-color:#3A4449}
.found .frame i{border-color:#56BC93}
.found .laser{display:none}

/* preview */
.pv-info{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.papers{display:grid;gap:18px}
.pwrap{overflow:hidden}
.paper{background:#fff;color:#111;transform-origin:top left;box-shadow:var(--shadow);font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.3;padding:28px 30px}
.paper.card{width:720px}
.paper.act{width:960px}
.paper h3{margin:0 0 10px;font-size:18px;text-align:center}
.paper .hd{display:grid;grid-template-columns:1fr auto;gap:4px 24px;margin-bottom:12px;font-size:13px}
.paper table{width:100%;border-collapse:collapse}
.paper th,.paper td{border:1px solid #333;padding:4px 6px;vertical-align:middle}
.paper th{background:#eee;font-size:11.5px}
.paper td.c{text-align:center}
.paper .bc{height:30px;width:130px;display:block}
.paper .sign{display:flex;gap:40px;margin-top:22px;font-size:13px}
.paper .sign span{flex:1;border-bottom:1px solid #333;padding-bottom:18px}
.pg{font-size:11px;color:#666;text-align:right;margin-top:8px}

.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--ground);padding:12px 18px;border-radius:12px;font-weight:600;font-size:15px;max-width:calc(100vw - 32px);box-shadow:var(--shadow);animation:fade .15s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.cam{position:relative;overflow:hidden}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .frame{z-index:1}
.scanner[hidden]{display:none}
.scanner .caption{min-height:3.2em}
.scanner .row2 .btn{min-height:52px}
.scanner .tools{display:flex;gap:4px}
.icon-btn.on{background:var(--marker);color:var(--marker-ink)}
.paper.export{box-shadow:none}
.loading{display:grid;place-items:center;min-height:70vh;text-align:center;gap:14px}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--ink);animation:rot .8s linear infinite;margin:0 auto 12px}
@keyframes rot{to{transform:rotate(360deg)}}
.pwd{position:relative}
.btn .spin{width:18px;height:18px;border-width:3px;margin:0;border-color:rgba(128,128,128,.4);border-top-color:currentColor}
.btn svg{width:20px;height:20px;flex:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="scan" class="scanner" hidden role="dialog" aria-modal="true" aria-label="Сканер штрихкода">
  <div class="top"><span style="padding-left:8px;font-weight:600">Сканер</span>
    <div class="tools"><button id="torch" class="icon-btn" data-act="torch" aria-label="Фонарик" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8l-1 6H9zM9 9l1 12h4l1-12"/></svg></button>
    <button class="icon-btn" data-act="closeScanner" aria-label="Закрыть сканер"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>
  <div class="cam"><video id="vid" playsinline muted autoplay></video><div class="frame"><i></i><i></i><i></i><i></i><div class="laser"></div></div></div>
  <p class="caption" id="scan-cap" role="status">Наведите камеру на штрихкод товара</p>
  <p class="proto" id="scan-diag"></p>
  <div class="bottom row2"><label class="btn" for="photo">Сфотографировать</label><button class="btn" data-act="manualFromScanner">Ввести вручную</button></div>
  <input id="photo" type="file" accept="image/*" capture="environment" hidden>
</div>
<script>
"use strict";
const API_URL="https://script.google.com/macros/s/AKfycbwz3IVdXxBNKzu041lpc7mrQpsoZZwUBfhmefT4FDBWBmEVLdjSpbw-BO0tcuxkJJ9ctQ/exec"; // ссылка /exec из Apps Script
const API_ON=/^https:\/\/script\.google\.com\//.test(API_URL);
const APP_VERSION="1.0 beta";
const STORE="Магазин 36 Барнаул 1";
let DEPTS={1:"стройка",2:"столярные изделия",3:"электротовары",4:"инструменты",5:"напольные покрытия",6:"плитка",7:"сантехника",8:"водоснабжение",9:"сад",10:"скобяные изделия",11:"краска",12:"декор",13:"свет",14:"хранение",15:"кухни",50:"ADM",51:"приемка",52:"COK",53:"инженер",54:"выдача",55:"логистика"};
const depName=d=>DEPTS[d]||"без названия";
let CODES=[["С1","брак"],["С2","кража"],["С3","коррекция"],["P","экспо"],["GE","нужды отдела"],["GEMG","нужды магазина"],["PMG","другой магазин"],["PP","на ЦО"]];
let REASONS=["Порча товара сотрудниками ЦПМ","Порча товара сотрудниками ОЗК","Порча товара сотрудниками отдела","Порча товара подрядчиками","Порча товара покупателями","Порча транспортной компанией","Несоблюдение условий хранения и содержания","ПУШ-распределение (ЦО)","Перезаказ (отдел)","Возврат от покупателя","Списание по вине производителя (качество)","Остатки отрезного/мерного товара","Неправильная колеровка/отказ от товара","BRAC/BRACRC","Срок годности","Некомплект (от поставщика)","Списание AVS","Списание TOP0","Списание мертвого/токсичного стока"];
const DEMO=[["4044996171173","82492447",4,"ВЫКОЛОТКА 4X150ММ СТАЛЬ",93.2],["4640032026812","89409773",4,"ВИНТОВЕРТ УДАР. 250ВТ ВУ 25-10РЭ ELITECH",3126.27],["8695024202510","89381118",7,"Мыльница Yanki сер/чер керамика",210.32],["4680655840235","89384439",7,"Держатель 5 крючков INN дер/бел б/сверл",667.23],["4607185826973","86170854",13,"ЛАМПА LED E27 ШАР 8W 750LM 3К BELLIGHT",39.49],["4015000408271","12778995",6,"СИЛИК ЗАТ-КА Церезит CS25 280 МЛ ПРОЗРАЧ",277]];
const LIMIT={card:30,act:19};
const KEY="spisanie-v1",TOKKEY="spisanie-token";
const XLSX_MIME="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
const LIBS={
  bdpoly:{g:"BarcodeDetectionAPI",u:["https://cdn.jsdelivr.net/npm/barcode-detector@2.3.1/dist/iife/pure.min.js","https://fastly.jsdelivr.net/npm/barcode-detector@2/dist/iife/pure.min.js","https://unpkg.com/barcode-detector@2.3.1/dist/iife/pure.min.js"]},
  zxing:{g:"ZXing",u:["https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js","https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"]},
  h2c:{g:"html2canvas",u:["https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js","https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"]},
  jspdf:{g:"jspdf",u:["https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js","https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"]},
  exceljs:{g:"ExcelJS",u:["https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js","https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"]}
};

/* ---------- storage ---------- */
function blank(){return {user:null,docs:[],last:{card:REASONS[2],act:"С1"},hintHidden:false,meta:null}}
function load(){try{const r=localStorage.getItem(KEY);return r?Object.assign(blank(),JSON.parse(r)):blank()}catch(e){return blank()}}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function getTok(){try{return localStorage.getItem(TOKKEY)}catch(e){return null}}
function setTok(p){try{p==null?localStorage.removeItem(TOKKEY):localStorage.setItem(TOKKEY,p)}catch(e){}}
const touched=d=>Math.max(d.updatedAt||0,d.sentAt||0,d.createdAt||0);
(function cleanup(){const week=7*864e5,now=Date.now();S.docs=S.docs.filter(d=>now-touched(d)<week);save()})();

let V={view:"loading",docId:null,sheet:null,toast:null,err:"",nameDraft:"",out:null,loadingText:"Загрузка…"};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>n.toLocaleString("ru-RU",{minimumFractionDigits:2,maximumFractionDigits:2})+" ₽";
const dateStr=t=>new Date(t).toLocaleDateString("ru-RU");
const timeStr=t=>new Date(t).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
function when(t){const d=new Date(t),n=new Date();return d.toDateString()===n.toDateString()?"сегодня в "+timeStr(t):dateStr(t)+" в "+timeStr(t)}
function plural(n,a,b,c){n=Math.floor(Math.abs(n));const m10=n%10,m100=n%100;return m10===1&&m100!==11?a:(m10>=2&&m10<=4&&(m100<10||m100>=20)?b:c)}
const fq=q=>String(q).replace(".",",");
function parseQty(v){const n=parseFloat(String(v).replace(",","."));return isFinite(n)&&n>0?Math.round(n*1000)/1000:null}
const codeName=c=>(CODES.find(x=>x[0]===c)||[c,""])[1];
const doc=()=>S.docs.find(d=>d.id===V.docId);
function docTitle(d){return d.type==="card"?`Карточка ${d.code}, ${codeName(d.code)}`:"Акт об утилизации"}
function vibrate(ms){try{navigator.vibrate&&navigator.vibrate(ms||40)}catch(e){}}
function toast(msg){V.toast=msg;render();clearTimeout(toast.t);toast.t=setTimeout(()=>{V.toast=null;render()},3000)}
function groups(d){const g={};d.items.forEach(it=>{(g[it.dep]=g[it.dep]||[]).push(it)});return Object.keys(g).sort((a,b)=>a-b).map(k=>({dep:+k,items:g[k]}))}
function b64d(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
const libP={};
function loadLib(k){
  const L=LIBS[k];if(window[L.g])return Promise.resolve();
  return libP[k]||(libP[k]=(async()=>{
    for(const u of L.u){try{await new Promise((res,rej)=>{const s=document.createElement("script");s.src=u;s.async=true;s.onload=res;s.onerror=rej;document.head.appendChild(s)});if(window[L.g])return}catch(e){}}
    libP[k]=null;throw new Error("Не загрузилась библиотека "+k);
  })());
}
function download(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000)}

class ApiError extends Error{constructor(code){super(code);this.code=code}}
async function api(action,payload){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),25000);
  let res;
  try{res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action},payload||{})),signal:ctl.signal,redirect:"follow"})}
  catch(e){throw new ApiError("network")}finally{clearTimeout(t)}
  let j;try{j=await res.json()}catch(e){throw new ApiError("network")}
  if(!j.ok)throw new ApiError(j.error||"server");
  return j;
}
function applyMeta(m){
  if(!m)return;
  if(m.depts&&m.depts.length){const o={};m.depts.forEach(([k,v])=>o[k]=v);DEPTS=o}
  if(m.codes&&m.codes.length)CODES=m.codes;
  if(m.reasons&&m.reasons.length)REASONS=m.reasons;
}
const PCACHE=new Map();
async function lookup(raw){
  const c=String(raw).replace(/\D/g,"");if(!c)return null;
  if(!API_ON){return DEMO.map(r=>({shk:r[0],lm:r[1],dep:r[2],name:r[3],zc:r[4]})).find(p=>p.shk===c||p.lm===c)||null}
  if(PCACHE.has(c))return PCACHE.get(c);
  try{const j=await api("find",{token:getTok(),code:c});PCACHE.set(c,j.product);if(j.product.shk)PCACHE.set(j.product.shk,j.product);PCACHE.set(j.product.lm,j.product);return j.product}
  catch(e){if(e.code==="not_found")return null;if(e.code==="bad_token")sessionExpired();throw e}
}

/* ---------- Code128 (набор B) ---------- */
const C128="212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232 2331112".split(" ");
function barcode(text){
  const codes=[104];for(const ch of text)codes.push(ch.charCodeAt(0)-32);
  let sum=104;for(let i=1;i<codes.length;i++)sum+=codes[i]*i;codes.push(sum%103,106);
  let x=10,r="";codes.forEach(c=>{const p=C128[c];for(let i=0;i<p.length;i++){const w=+p[i];if(i%2===0)r+=`<rect x="${x}" y="0" width="${w}" height="40"/>`;x+=w}});
  return `<svg class="bc" viewBox="0 0 ${x+10} 40" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">${r}</svg>`;
}

async function tryDetector(BD,label){
  if(!BD)return null;
  try{
    const sup=await BD.getSupportedFormats();const f=WANT.filter(x=>sup.includes(x));
    if(!f.includes("ean_13"))return null;
    const bd=new BD({formats:f});SC.engine=label;
    SC.det=async src=>{const r=await bd.detect(src);return r.length?r[0].rawValue:null};
    return SC.det;
  }catch(e){diag(label+": "+(e&&e.message||e));return null}
}
function frameCanvas(src,max){
  const w=src.videoWidth||src.naturalWidth||src.width,h=src.videoHeight||src.naturalHeight||src.height;if(!w||!h)return null;
  const sc=Math.min(1,(max||1280)/Math.max(w,h)),cv=SC.cv||(SC.cv=document.createElement("canvas"));
  cv.width=Math.round(w*sc);cv.height=Math.round(h*sc);cv.getContext("2d",{willReadFrequently:true}).drawImage(src,0,0,cv.width,cv.height);return cv;
}
async function getDecoder(){
  if(SC.det)return SC.det;
  if(await tryDetector(window.BarcodeDetector,"встроенный"))return SC.det;
  try{await loadLib("bdpoly");const BD=(window.BarcodeDetectionAPI&&window.BarcodeDetectionAPI.BarcodeDetector)||window.BarcodeDetector;if(await tryDetector(BD,"zxing-wasm"))return SC.det}catch(e){diag("zxing-wasm: не загрузился")}
  await loadLib("zxing");
  const Z=window.ZXing,hints=new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.ITF]);
  hints.set(Z.DecodeHintType.TRY_HARDER,true);
  const reader=new Z.BrowserMultiFormatReader(hints);SC.engine="zxing-js";
  SC.det=async(src,max)=>{
    const cv=frameCanvas(src,max);if(!cv)return null;
    try{return reader.decodeFromCanvas?reader.decodeFromCanvas(cv).getText():(await reader.decodeFromImageUrl(cv.toDataURL("image/jpeg",.92))).getText()}
    catch(e){const n=e&&(e.name||e.constructor&&e.constructor.name)||"";if(!/NotFound|Checksum|Format/i.test(n)&&!/NotFound/i.test(String(e&&e.message)))diag("zxing-js: "+n+" "+(e&&e.message||""));return null}
  };
  return SC.det;
}
function stopStream(){if(SC.stream){SC.stream.getTracks().forEach(t=>t.stop());SC.stream=null}const v=$("#vid");if(v)v.srcObject=null}
async function openScanner(){
  V.sheet=null;render();
  const L=$("#scan");L.hidden=false;L.classList.remove("found");$("#torch").hidden=true;$("#torch").classList.remove("on");SC.torch=false;
  SC.on=true;SC.last="";setCap("Включаю камеру…");
  if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setCap("Камера недоступна при таком способе открытия. Сфотографируйте штрихкод или введите код вручную.");getDecoder().catch(()=>{});return}
  try{SC.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}}})}
  catch(e){setCap(e.name==="NotAllowedError"?"Нет доступа к камере. Разрешите его в настройках браузера или сфотографируйте штрихкод.":"Не удалось включить камеру. Сфотографируйте штрихкод или введите код вручную.");getDecoder().catch(()=>{});return}
  if(!SC.on){stopStream();return}
  const v=$("#vid");v.srcObject=SC.stream;try{await v.play()}catch(e){}
  const tr=SC.stream.getVideoTracks()[0],caps=tr.getCapabilities?tr.getCapabilities():{};
  $("#torch").hidden=!caps.torch;
  if(caps.focusMode&&caps.focusMode.includes("continuous"))tr.applyConstraints({advanced:[{focusMode:"continuous"}]}).catch(()=>{});
  try{await getDecoder()}catch(e){setCap("Не загрузился модуль распознавания. Проверьте интернет или введите код вручную.");return}
  if(!SC.on)return;
  setCap("Наведите камеру на штрихкод товара");diag("Распознавание: "+(SC.engine||"?"));loop();
}
async function loop(){
  if(!SC.on)return;const v=$("#vid");
  if(!SC.busy&&v.readyState>=2){SC.busy=true;let code=null;try{code=await SC.det(v)}catch(e){}if(code&&SC.on&&await onCode(code)){SC.busy=false;return}SC.busy=false}
  SC.timer=setTimeout(loop,110);
}
async function onCode(raw){
  const code=String(raw).replace(/\D/g,""),now=Date.now();
  if(!code)return false;
  if(code===SC.last&&now-SC.lastAt<3000)return false;SC.last=code;SC.lastAt=now;
  vibrate(30);setCap(`Считано ${code}, ищу в таблице…`);
  let p;
  try{p=await lookup(code)}catch(e){SC.lastAt=Date.now();if(e.code!=="bad_token")setCap(ERR[e.code]||ERR.server);return e.code==="bad_token"}
  SC.lastAt=Date.now();
  if(!SC.on)return true;
  if(!p){vibrate(150);setCap(`Код ${code} не найден в таблице. Попробуйте другой штрихкод на товаре или введите артикул вручную.`);return false}
  $("#scan").classList.add("found");setCap("Найдено");
  setTimeout(()=>{closeScanner();openItem(p)},200);return true;
}
function closeScanner(){SC.on=false;clearTimeout(SC.timer);stopStream();$("#scan").hidden=true}
async function onPhoto(file){
  if(!file)return;setCap("Ищу штрихкод на фото…");
  let url;
  try{
    const det=await getDecoder();
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url=URL.createObjectURL(file)});
    let code=null;
    for(const m of [2000,1400,900]){const cv=frameCanvas(img,m);if(!cv)break;const copy=document.createElement("canvas");copy.width=cv.width;copy.height=cv.height;copy.getContext("2d").drawImage(cv,0,0);
      try{code=await det(copy,m)}catch(e){diag((SC.engine||"")+": "+(e&&e.message||e))}if(code)break}
    if(code){SC.last="";await onCode(code)}else{vibrate(150);setCap("На фото не нашёлся штрихкод. Сфотографируйте ближе и ровнее, чтобы код был целиком в кадре.")}
  }catch(e){diag("фото: "+(e&&e.message||e));setCap("Не удалось обработать фото. Введите код вручную.")}
  finally{if(url)URL.revokeObjectURL(url)}
}
function openItem(p){
  const d=doc(),ex=d.items.find(i=>i.lm===p.lm);
  V.sheet={kind:"item",mode:"new",p,qty:1,reason:S.last[d.type],dupQty:ex?ex.qty:0};render();
}

/* ---------- формирование файлов ---------- */
const outKey=d=>d.id+":"+d.updatedAt;
function fileName(d,ext){const deps=groups(d).map(g=>g.dep).join("-");const dt=dateStr(Date.now()).replace(/\./g,"-");return `${d.type==="card"?"Карточка_"+d.code:"Акт_утилизации"}_отд${deps}_${dt}.${ext}`}
async function prepareOutputs(){
  const d=doc(),key=outKey(d);V.out={key};
  try{
    const pg=pagesFor(d);
    const pdf=await buildPdf(d,pg);if(!V.out||V.out.key!==key)return;V.out.pdf=pdf;if(V.view==="preview")render();
    const xlsx=await buildXlsx(d,pg);if(!V.out||V.out.key!==key)return;V.out.xlsx=xlsx;
  }catch(e){console.error(e);if(V.out&&V.out.key===key)V.out.err="Не удалось подготовить файлы. Проверьте интернет и попробуйте ещё раз."}
  if(V.view==="preview")render();
}
async function buildPdf(d,pg){
  await loadLib("h2c");await loadLib("jspdf");
  const host=document.createElement("div");host.style.cssText="position:fixed;left:-30000px;top:0";
  host.innerHTML=pg.map(p=>paperHTML(d,p,"export")).join("");document.body.appendChild(host);
  const land=d.type==="act",W=land?297:210,H=land?210:297,M=8;
  const pdf=new window.jspdf.jsPDF({orientation:land?"landscape":"portrait",unit:"mm",format:"a4",compress:true});
  try{
    const els=[...host.children];
    for(let i=0;i<els.length;i++){
      const c=await html2canvas(els[i],{scale:2,backgroundColor:"#ffffff",logging:false});
      if(i)pdf.addPage("a4",land?"landscape":"portrait");
      let w=W-2*M,h=c.height*w/c.width;if(h>H-2*M){h=H-2*M;w=c.width*h/c.height}
      pdf.addImage(c.toDataURL("image/jpeg",.9),"JPEG",(W-w)/2,M,w,h);
    }
  }finally{host.remove()}
  return new File([pdf.output("blob")],fileName(d,"pdf"),{type:"application/pdf"});
}
async function buildXlsx(d,pg){
  await loadLib("exceljs");
  const wb=new ExcelJS.Workbook(),thin={style:"thin"},box={top:thin,left:thin,bottom:thin,right:thin},now=dateStr(Date.now());
  const used=new Set();
  pg.forEach(p=>{
    let nm=`Отдел ${p.dep}`+(p.pages>1?` лист ${p.page}`:"");while(used.has(nm))nm+="_";used.add(nm);
    const ws=wb.addWorksheet(nm,{pageSetup:{paperSize:9,orientation:d.type==="card"?"portrait":"landscape",fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:.4,right:.4,top:.5,bottom:.5,header:.2,footer:.2}}});
    const head=(r,vals)=>{const row=ws.getRow(r);vals.forEach((v,i)=>{const c=row.getCell(i+1);c.value=v;c.font={bold:true};c.border=box;c.alignment={horizontal:"center",vertical:"middle",wrapText:true};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFEDEDED"}}});row.height=30};
    if(d.type==="card"){
      ws.columns=[{width:5},{width:12},{width:44},{width:8},{width:16},{width:34},{width:11},{width:13}];
      ws.mergeCells("A1:H1");const t=ws.getCell("A1");t.value="Карточка известных потерь";t.font={bold:true,size:14};t.alignment={horizontal:"center"};
      ws.getCell("A2").value=STORE;
      ws.getCell("A3").value="Отдел, производящий списание:";ws.getCell("C3").value=`${p.dep} - ${depName(p.dep)}`;ws.getCell("C3").font={bold:true};
      ws.getCell("E3").value="Код:";ws.getCell("F3").value=`${d.code} - ${codeName(d.code)}`;ws.getCell("F3").font={bold:true};
      ws.getCell("A4").value="Дата:";ws.getCell("C4").value=now;
      ws.getCell("A5").value="Руководитель сектора:";ws.getCell("E5").value="ОПВС:";
      head(7,["№","Артикул","Наименование","Кол-во","Штрихкод","Причина","ЗЦ, ₽","Сумма ЗЦ, ₽"]);
      let r=8;
      p.items.forEach((it,i)=>{const row=ws.getRow(r);row.values=[p.no0+i+1,it.lm,it.name,it.qty,it.shk,it.reason,it.zc,{formula:`D${r}*G${r}`,result:Math.round(it.qty*it.zc*100)/100}];
        row.eachCell({includeEmpty:true},(c,k)=>{c.border=box;c.alignment={vertical:"middle",wrapText:k===3||k===6,horizontal:[1,2,4,5].includes(k)?"center":undefined}});
        row.getCell(7).numFmt="#,##0.00";row.getCell(8).numFmt="#,##0.00";r++});
      const total=p.all.reduce((s,i)=>s+i.qty*i.zc,0);
      ws.getCell("E4").value="Сумма ЗЦ:";const sc=ws.getCell("F4");sc.value=p.pages>1?Math.round(total*100)/100:{formula:`SUM(H8:H${r-1})`,result:Math.round(total*100)/100};sc.numFmt="#,##0.00 ₽";sc.font={bold:true};
      ws.getCell(`A${r+2}`).value="Карточку составил:";ws.getCell(`C${r+2}`).value=S.user.name;ws.getCell(`E${r+2}`).value="Подпись: ____________";
    }else{
      ws.columns=[{width:17},{width:12},{width:52},{width:9},{width:16}];
      ws.mergeCells("A1:E1");const t=ws.getCell("A1");t.value="Акт об утилизации товаров";t.font={bold:true,size:14};t.alignment={horizontal:"center"};
      ws.getCell("A3").value="036Барнаул";ws.getCell("D3").value="ДАТА";ws.getCell("E3").value=now;
      ws.getCell("A4").value=`отдел - ${p.dep}`;
      head(6,["ШК","Л/М","Наименование","Кол-во","Причина"]);
      let r=7;
      p.items.forEach(it=>{const row=ws.getRow(r);row.values=[it.shk,it.lm,it.name,it.qty,it.reason];row.eachCell({includeEmpty:true},(c,k)=>{c.border=box;c.alignment={vertical:"middle",wrapText:k===3,horizontal:k===3?undefined:"center"}});r++});
      ws.getCell(`A${r+2}`).value="Руководитель сектора / менеджер отдела";ws.getCell(`C${r+2}`).value="Специалист/руководитель ОПВС";
    }
  });
  const buf=await wb.xlsx.writeBuffer();
  return new File([buf],fileName(d,"xlsx"),{type:XLSX_MIME});
}
function markSent(){const d=doc();d.status="sent";d.sentAt=Date.now();save()}

/* ---------- действия ---------- */
const newId=()=>"d"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const A={
  async login(){
    const n=$("#f-name").value.trim(),pw=$("#f-pin").value;V.nameDraft=n;
    if(n.length<2){V.err="Введите имя и фамилию, они попадут в строку «Карточку составил».";return render()}
    if(API_ON&&!pw){V.err="Введите пароль магазина.";return render()}
    V.view="loading";V.loadingText="Проверяю пароль…";render();
    if(API_ON){
      try{const j=await api("login",{password:pw,name:n});setTok(j.token);S.meta=j.meta;applyMeta(j.meta)}
      catch(e){V.view="login";V.err={bad_password:"Неверный пароль.",locked:"Слишком много неверных попыток. Вход временно закрыт, попробуйте через 10 минут.",not_configured:"В таблице не задан пароль. Обратитесь к руководителю."}[e.code]||ERR[e.code]||ERR.server;return render()}
    }else setTok("demo");
    S.user={name:n};save();V.err="";V.view="home";render();
  },
  menu(){V.sheet={kind:"menu"};render()},
  logout(){setTok(null);S.user=null;save();V={view:"login",sheet:null,err:"",nameDraft:"",out:null};render()},
  hideHint(){S.hintHidden=true;save();render()},
  home(){V.view="home";V.docId=null;render()},
  newCard(){V.view="setup";render()},
  newAct(){const d={id:newId(),type:"act",code:"С1",status:"draft",createdAt:Date.now(),updatedAt:Date.now(),items:[]};S.docs.push(d);save();V.docId=d.id;V.view="doc";render();openScanner()},
  createCard(){const c=document.querySelector('input[name="code"]:checked').value;const d={id:newId(),type:"card",code:c,status:"draft",createdAt:Date.now(),updatedAt:Date.now(),items:[]};S.docs.push(d);save();V.docId=d.id;V.view="doc";render();openScanner()},
  open(ds){V.docId=ds.id;V.view="doc";render()},
  scan(){openScanner()},
  closeScanner(){closeScanner()},
  torch(){const tr=SC.stream&&SC.stream.getVideoTracks()[0];if(!tr)return;SC.torch=!SC.torch;tr.applyConstraints({advanced:[{torch:SC.torch}]}).catch(()=>{});$("#torch").classList.toggle("on",SC.torch)},
  manual(){V.sheet={kind:"manual"};render();$("#f-code").focus()},
  manualFromScanner(){closeScanner();A.manual()},
  async findCode(){const v=$("#f-code").value.trim();
    if(!v){V.sheet={kind:"manual",err:"Введите код товара."};return render()}
    V.sheet={kind:"manual",value:v,busy:true};render();
    let p;try{p=await lookup(v)}catch(e){if(e.code==="bad_token")return;V.sheet={kind:"manual",value:v,err:ERR[e.code]||ERR.server};return render()}
    if(!V.sheet||V.sheet.kind!=="manual")return;
    if(!p){V.sheet={kind:"manual",value:v,err:`Код ${v} не найден в таблице. Проверьте цифры.`};return render()}
    openItem(p)},
  qty(ds){const inp=$("#f-qty"),v=parseQty(inp.value)||0,n=Math.round((v+ +ds.d)*1000)/1000;if(n>0)inp.value=fq(n)},
  addItem(ds){const d=doc(),s=V.sheet,q=parseQty($("#f-qty").value),r=$("#f-reason").value;
    if(!q){s.err="Укажите количество больше нуля.";s.qty=$("#f-qty").value;s.reason=r;return render()}
    const ex=d.items.find(i=>i.lm===s.p.lm);
    if(ex){ex.qty=Math.round((ex.qty+q)*1000)/1000;ex.reason=r}else d.items.push({shk:s.p.shk,lm:s.p.lm,name:s.p.name,dep:s.p.dep,zc:s.p.zc,qty:q,reason:r});
    S.last[d.type]=r;d.updatedAt=Date.now();save();V.sheet=null;
    toast("Добавлено: "+fq(q)+" шт");if(ds.next)openScanner()},
  edit(ds){const it=doc().items[+ds.i];V.sheet={kind:"item",mode:"edit",i:+ds.i,p:it,qty:it.qty,reason:it.reason};render()},
  saveItem(){const d=doc(),s=V.sheet,it=d.items[s.i],q=parseQty($("#f-qty").value);
    if(!q){s.err="Укажите количество больше нуля.";return render()}
    it.qty=q;it.reason=$("#f-reason").value;d.updatedAt=Date.now();save();V.sheet=null;toast("Сохранено")},
  removeItem(){const d=doc();d.items.splice(V.sheet.i,1);d.updatedAt=Date.now();save();V.sheet=null;toast("Позиция удалена")},
  delDoc(){V.sheet={kind:"confirmDel"};render()},
  doDelDoc(){S.docs=S.docs.filter(d=>d.id!==V.docId);save();V.sheet=null;V.view="home";toast("Документ удалён")},
  closeSheet(){V.sheet=null;render()},
  preview(){V.view="preview";window.scrollTo(0,0);render()},
  back(){V.view="doc";render()},
  retry(){V.out=null;render()},
  share(){
    const f=V.out&&V.out.pdf;if(!f)return;
    if(navigator.canShare&&navigator.share&&navigator.canShare({files:[f]})){
      navigator.share({files:[f],title:f.name}).then(()=>{markSent();toast("Готово")}).catch(e=>{if(e.name!=="AbortError"){download(f,f.name);markSent();toast("Поделиться не получилось, PDF скачан")}});
    }else{download(f,f.name);markSent();toast("Этот браузер не умеет делиться файлами, PDF скачан")}
  },
  dlPdf(){const f=V.out&&V.out.pdf;if(f){download(f,f.name);markSent();toast("PDF скачан")}},
  dlXlsx(){const f=V.out&&V.out.xlsx;if(f){download(f,f.name);markSent();toast("Excel скачан")}}
};
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t||t.disabled)return;const f=A[t.dataset.act];if(f){e.preventDefault();f(t.dataset,t)}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"){if(e.target.id==="f-code")A.findCode();else if(e.target.id==="f-pin"||e.target.id==="f-name")A.login()}else if(e.key==="Escape"){if(SC.on)closeScanner();else if(V.sheet)A.closeSheet()}});
$("#photo").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];onPhoto(f);e.target.value=""});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&SC.on)closeScanner()});

/* ---------- старт ---------- */
(function start(){
  applyMeta(S.meta);
  V.view=S.user&&getTok()?"home":"login";
  render();
  if(API_ON&&S.user&&getTok())api("meta",{token:getTok()}).then(j=>{S.meta=j.meta;save();applyMeta(j.meta);if(V.view==="home"||V.view==="setup")render()}).catch(e=>{if(e.code==="bad_token")sessionExpired()});
  setTimeout(()=>getDecoder().catch(()=>{}),800);
})();
